<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1e40af">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Biblioteca 6A">
  <link rel="apple-touch-icon" href="/icon-192.png">
<title>Biblioteca de Aula 6º A · Gestión de Préstamos</title>
<style>
  :root {
    --bg: #f0f4f8;
    --card: #ffffff;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --success: #16a34a;
    --warning: #ea580c;
    --danger: #dc2626;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 0;
    line-height: 1.5;
  }
  header {
    background: linear-gradient(135deg, #1e40af, #3b82f6);
    color: white;
    padding: 1.5rem 2rem;
    box-shadow: var(--shadow);
  }
  header h1 { margin: 0 0 0.25rem 0; font-size: 1.75rem; }
  header p { margin: 0; opacity: 0.9; font-size: 0.95rem; }
  .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
  .toolbar {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
    align-items: center;
  }
  .search {
    flex: 1;
    min-width: 220px;
    padding: 0.65rem 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
  }
  .btn {
    padding: 0.6rem 1.1rem;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
    transition: all 0.15s;
  }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-success { background: var(--success); color: white; }
  .btn-success:hover { background: #15803d; }
  .btn-warning { background: var(--warning); color: white; }
  .btn-danger { background: var(--danger); color: white; }
  .btn-outline { background: white; border: 1px solid var(--border); color: var(--text); }
  .btn-outline:hover { background: #f8fafc; }
  .btn-sm { padding: 0.3rem 0.6rem; font-size: 0.8rem; }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  .stat {
    background: var(--card);
    padding: 1rem;
    border-radius: 12px;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .stat .num { font-size: 1.8rem; font-weight: 700; color: var(--primary); }
  .stat .label { font-size: 0.85rem; color: var(--muted); }
  .tabs {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
    border-bottom: 2px solid var(--border);
    flex-wrap: wrap;
  }
  .tab {
    padding: 0.75rem 1.25rem;
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    font-weight: 600;
    cursor: pointer;
    color: var(--muted);
  }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 1.25rem;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 1.25rem;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .card h3 { margin: 0 0 0.75rem 0; font-size: 1.1rem; }
  .loan-box {
    background: #fef3c7;
    border-left: 4px solid #f59e0b;
    padding: 0.75rem;
    border-radius: 6px;
    margin: 0.75rem 0;
    font-size: 0.95rem;
  }
  .loan-box.empty { background: #f1f5f9; border-left-color: #94a3b8; }
  .points-box {
    background: #ecfdf5;
    border-left: 4px solid #10b981;
    padding: 0.6rem 0.75rem;
    border-radius: 6px;
    margin: 0.5rem 0;
    font-size: 0.95rem;
    font-weight: 600;
    color: #065f46;
  }
  .books-list { margin: 0.5rem 0; padding-left: 0; list-style: none; font-size: 0.9rem; }
  .books-list li { margin-bottom: 0.35rem; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
  .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem; }
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal.show { display: flex; }
  .modal-content {
    background: white;
    padding: 1.5rem;
    border-radius: 12px;
    width: 90%;
    max-width: 480px;
    box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
  }
  .modal-content h3 { margin-top: 0; }
  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; font-weight: 600; margin-bottom: 0.3rem; font-size: 0.9rem; }
  .form-group input, .form-group select {
    width: 100%;
    padding: 0.6rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 1rem;
  }
  .catalog-item {
    background: white;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    margin-bottom: 0.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid var(--border);
  }
  .ficha-table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
    margin-bottom: 1.5rem;
  }
  .ficha-table th, .ficha-table td {
    padding: 0.75rem 1rem;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .ficha-table th { background: #f8fafc; font-weight: 600; }
  .badge {
    display: inline-block;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .badge-yes { background: #dcfce7; color: #166534; }
  .badge-no { background: #fee2e2; color: #991b1b; }
  .summary-box {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 10px;
    padding: 1rem;
    margin-bottom: 1.5rem;
  }
  .current-trim {
    background: #fef3c7;
    border-color: #f59e0b;
  }
  footer {
    text-align: center;
    padding: 2rem;
    color: var(--muted);
    font-size: 0.85rem;
  }
  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; }
    header { padding: 1rem; }
  }
</style>
</head>
<body>
<header>
  <h1>📚 Biblioteca de Aula · 6º A</h1>
  <p>Curso 2026-2027 · Gestión de préstamos y aportaciones</p>
</header>

<div class="container">
  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <input type="search" class="search" id="search" placeholder="Buscar alumno o libro...">
    <label style="display:flex; align-items:center; gap:0.5rem; font-weight:600; font-size:0.9rem;">
      Trimestre actual:
      <select id="trimSelect" onchange="setCurrentTrimestre(this.value)" style="padding:0.4rem 0.6rem; border-radius:6px; border:1px solid var(--border);">
        <option value="1">1er Trimestre</option>
        <option value="2">2º Trimestre</option>
        <option value="3">3er Trimestre</option>
      </select>
    </label>
    <button class="btn btn-outline" onclick="exportData()">⬇️ Exportar JSON</button>
    <button class="btn btn-outline" onclick="exportCSV()">📊 Exportar CSV (Google Sheets)</button>
    <button class="btn btn-outline" onclick="document.getElementById('importFile').click()">⬆️ Importar</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    <button class="btn btn-danger" onclick="resetEmpty()" style="margin-left:auto;">🗑️ Vaciar todos los datos</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="alumnos">Alumnos y Préstamos</button>
    <button class="tab" data-tab="catalogo">Catálogo de la Biblioteca</button>
    <button class="tab" data-tab="fichas">Fichas de Lectura</button>
  </div>

  <div id="view-alumnos"></div>
  <div id="view-catalogo" style="display:none;"></div>
  <div id="view-fichas" style="display:none;"></div>
</div>

<!-- Modal Prestar / Devolver -->
<div class="modal" id="modalLoan">
  <div class="modal-content">
    <h3 id="modalTitle">Prestar libro</h3>
    <div class="form-group">
      <label>Alumno</label>
      <div id="modalStudentName" style="font-weight:600;"></div>
    </div>
    <div class="form-group">
      <label>Título del libro</label>
      <input type="text" id="modalBook" placeholder="Ej: Los Futbolísimos 20">
    </div>
    <div class="form-group">
      <label>Fecha de préstamo (o estado)</label>
      <input type="text" id="modalDate" placeholder="2026-10-14 o 'ficha'">
    </div>
    <div style="display:flex; gap:0.5rem; justify-content:flex-end;">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveLoan()">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal Añadir libro aportado -->
<div class="modal" id="modalAddBook">
  <div class="modal-content">
    <h3>Añadir libro aportado</h3>
    <div class="form-group">
      <label>Alumno</label>
      <div id="modalAddStudent" style="font-weight:600;"></div>
    </div>
    <div class="form-group">
      <label>Título del libro</label>
      <input type="text" id="modalAddTitle" placeholder="Título del libro aportado a la biblioteca">
    </div>
    <div style="display:flex; gap:0.5rem; justify-content:flex-end;">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-success" onclick="addContributedBook()">Añadir</button>
    </div>
  </div>
</div>

<!-- Modal Añadir ficha de lectura -->
<div class="modal" id="modalAddFicha">
  <div class="modal-content">
    <h3>Añadir ficha de lectura</h3>
    <div class="form-group">
      <label>Alumno</label>
      <div id="modalFichaStudent" style="font-weight:600;"></div>
    </div>
    <div class="form-group">
      <label>Trimestre</label>
      <div id="modalFichaTrim" style="font-weight:600;"></div>
    </div>
    <div class="form-group">
      <label>Título del libro de la ficha</label>
      <input type="text" id="modalFichaTitle" placeholder="Ej: Diario de Greg 5">
    </div>
    <div style="display:flex; gap:0.5rem; justify-content:flex-end;">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-success" onclick="saveFicha()">Guardar ficha (+0,25 pts)</button>
    </div>
  </div>
</div>

<footer>
  Datos guardados automáticamente en este navegador · Cada ficha del trimestre actual vale 0,25 puntos
</footer>

<script>
// ========== DATOS INICIALES ==========
const INITIAL_DATA = {
  "students": [
    {"id":1,"nombre":"Miguel","apellidos":"Aceituno Pérez","prestamo_fecha":null,"prestamo_libro":null,"aportados":[]},
    {"id":2,"nombre":"Gabriel","apellidos":"Álvarez Sánchez-Carpintero","prestamo_fecha":"2026-10-09","prestamo_libro":"¡GOL! 6","aportados":["¡GOL! 1","¡GOL! 6","Los Futbolísimos 22","Los Futbolísimos 24","Los Futbolísimos 25"]},
    {"id":3,"nombre":"Aarón","apellidos":"Betancort Flores","prestamo_fecha":null,"prestamo_libro":null,"aportados":[]},
    {"id":4,"nombre":"Íñigo","apellidos":"Campoy González","prestamo_fecha":"2026-09-29","prestamo_libro":"Los Futbolísimos 24","aportados":["Los Futbolísimos 19","Los Once 4"]},
    {"id":5,"nombre":"Miguel","apellidos":"Díaz Calle","prestamo_fecha":"2026-09-28","prestamo_libro":"Los Futbolísimos 17","aportados":["¡GOL! 3"]},
    {"id":6,"nombre":"Joaquín","apellidos":"Díez Tejado","prestamo_fecha":"ficha","prestamo_libro":"Los Futbolísimos 15","aportados":["500 preguntas y respuestas sobre los animales","Plants vs Zombies. Hogar frondoso hogar","Plants vs Zombies. Dinomita","La extraña niebla roja"]},
    {"id":7,"nombre":"Jianhong","apellidos":"Gao Feng","prestamo_fecha":null,"prestamo_libro":null,"aportados":[]},
    {"id":8,"nombre":"Lucas","apellidos":"García Dueñas","prestamo_fecha":"14/103","prestamo_libro":"Los Futbolísimos 25","aportados":["Lightfall. La sombra del pájaro."]},
    {"id":9,"nombre":"Miguel","apellidos":"Herranz Matas","prestamo_fecha":"2026-10-02","prestamo_libro":"Paty Centella y el enigma de la roca lunar","aportados":["La historia interminable"]},
    {"id":10,"nombre":"Santiago","apellidos":"Larrocha Martínez-Algora","prestamo_fecha":"2026-09-29","prestamo_libro":"Los Futbolísimos 22","aportados":["Geronimo Stilton. La Gran Invasión de Ratonia.","Geronimo Stilton. Cuarto Viaje al Reino de la Fantasía","Geronimo Stilton. Regreso al Reino de la Fantasía","Geronimo Stilton. Tercer Viaje al Reino de la Fantasía","Paty Centella 2. El mapa de las oslas perdidas."]},
    {"id":11,"nombre":"Bosco","apellidos":"López Díaz","prestamo_fecha":null,"prestamo_libro":null,"aportados":[]},
    {"id":12,"nombre":"José Mauro","apellidos":"Martín Bezerra","prestamo_fecha":"2026-10-02","prestamo_libro":"Harry Potter 3","aportados":["Harry Potter 2","Harry Potter 3","Harry Potter 5","Harry Potter 6"]},
    {"id":13,"nombre":"Sergio","apellidos":"Martín Dueso","prestamo_fecha":null,"prestamo_libro":null,"aportados":[]},
    {"id":14,"nombre":"José Manuel","apellidos":"Martín Pérez","prestamo_fecha":null,"prestamo_libro":null,"aportados":[]},
    {"id":15,"nombre":"Erick Ditiane","apellidos":"Monteiro","prestamo_fecha":null,"prestamo_libro":null,"aportados":[]},
    {"id":16,"nombre":"Nicolás","apellidos":"Moreno Rubio","prestamo_fecha":null,"prestamo_libro":null,"aportados":[]},
    {"id":17,"nombre":"Santiago","apellidos":"Otero Molina","prestamo_fecha":"2026-10-14","prestamo_libro":"Paty Centella 2. El mapa de las oslas perdidas.","aportados":["Los Futbolísimos 15","Los Futbolísimos 17","Policán 2"]},
    {"id":18,"nombre":"Jesús","apellidos":"Pascual Fernández","prestamo_fecha":null,"prestamo_libro":null,"aportados":[]},
    {"id":19,"nombre":"Jesús","apellidos":"Raso Saco","prestamo_fecha":"2026-09-30","prestamo_libro":"Diario de Greg 4","aportados":["Nico Espía y el ingenioso Cervantes","El pianista que sabía demasiado","Ringo y el Vikingo","Superhéroe","Pablo Diablo y el partidazo de fútbol"]},
    {"id":20,"nombre":"Pablo","apellidos":"Ricarte Higuero","prestamo_fecha":"2026-10-14","prestamo_libro":"La extraña niebla roja","aportados":["Primos S.A 3"]},
    {"id":21,"nombre":"Eduardo Javier","apellidos":"Rosero Andújar","prestamo_fecha":null,"prestamo_libro":null,"aportados":[]},
    {"id":22,"nombre":"Alejandro","apellidos":"Sandín Laplana","prestamo_fecha":"2026-10-09","prestamo_libro":"¡GOL! 1","aportados":["Diario de Greg 4","Diario de Greg 5","Los Once 1"]},
    {"id":23,"nombre":"Ricardo Henrique","apellidos":"Silva Costa","prestamo_fecha":"2026-10-09","prestamo_libro":"Diario de Greg 5","aportados":["Tom Gates 1 (inglés)","Tom Gates 2 (inglés)","Tom Gates 3 (inglés)","Boni vs Mono 6","Boni vs Mono 7"]},
    {"id":24,"nombre":"Jonathan David","apellidos":"Zapeta Pérez","prestamo_fecha":"2026-09-29","prestamo_libro":"Los Futbolísimos 19","aportados":["Paty Centella y el enigma de la roca lunar"]}
  ],
  "fichas": {
    "1": {"2":"Diario de Greg 5","8":"Los Once 1","22":"Los Futbolísimos 25"},
    "2": {"2":"Diario de Greg 5","22":"Los Futbolísimos 25"},
    "3": {"2":"Diario de Greg 5","22":"Los Futbolísimos 25"}
  },
  "currentTrimestre": "1"
};

// ========== ESTADO ==========
let data = null;
let currentStudentId = null;
let searchTerm = "";
let activeTab = "alumnos";

function loadData() {
  const saved = localStorage.getItem('biblioteca6a');
  if (saved) {
    try {
      data = JSON.parse(saved);
      if (!data.currentTrimestre) data.currentTrimestre = "1";
      if (!data.fichas) data.fichas = {"1":{},"2":{},"3":{}};
      return;
    } catch(e) {}
  }
  data = JSON.parse(JSON.stringify(INITIAL_DATA));
}

function saveData() {
  localStorage.setItem('biblioteca6a', JSON.stringify(data));
}

function getStudent(id) {
  return data.students.find(s => s.id === id);
}

function normalize(str) {
  return (str || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function getCurrentPoints(studentId) {
  const trim = data.currentTrimestre || "1";
  const has = data.fichas[trim] && data.fichas[trim][String(studentId)];
  return has ? 0.25 : 0;
}

function setCurrentTrimestre(val) {
  data.currentTrimestre = val;
  saveData();
  document.getElementById('trimSelect').value = val;
  renderAll();
}

// ========== RENDER ==========
function renderStats() {
  const totalStudents = data.students.length;
  const activeLoans = data.students.filter(s => s.prestamo_libro).length;
  const totalBooks = new Set(data.students.flatMap(s => s.aportados)).size;
  const totalAportados = data.students.reduce((sum, s) => sum + s.aportados.length, 0);
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="num">${totalStudents}</div><div class="label">Alumnos</div></div>
    <div class="stat"><div class="num">${activeLoans}</div><div class="label">Préstamos activos</div></div>
    <div class="stat"><div class="num">${totalBooks}</div><div class="label">Títulos en biblioteca</div></div>
    <div class="stat"><div class="num">${totalAportados}</div><div class="label">Libros aportados</div></div>
  `;
}

function renderAlumnos() {
  const term = normalize(searchTerm);
  const filtered = data.students.filter(s => {
    const full = normalize(s.nombre + ' ' + s.apellidos);
    const books = normalize(s.aportados.join(' ') + ' ' + (s.prestamo_libro || ''));
    return !term || full.includes(term) || books.includes(term);
  });

  const html = filtered.map(s => {
    const hasLoan = !!s.prestamo_libro;
    const trim = data.currentTrimestre || "1";
    const hasFicha = !!(data.fichas[trim] && data.fichas[trim][String(s.id)]);
    const loanHtml = hasLoan
      ? `<div class="loan-box"><strong>📖 ${s.prestamo_libro}</strong><br><small>${s.prestamo_fecha || 'sin fecha'}</small></div>`
      : `<div class="loan-box empty">No tiene libro prestado</div>`;

    const points = getCurrentPoints(s.id);
    const pointsHtml = `<div class="points-box">Fichas de lectura (${data.currentTrimestre}º trim.): <strong>${points.toFixed(2)} pts</strong></div>`;

    const booksHtml = s.aportados.length
      ? `<ul class="books-list">${s.aportados.map((b, i) => `<li><span>${b}</span> <button class="btn btn-danger btn-sm" onclick="removeBook(${s.id}, ${i})" title="Quitar este libro">✕</button></li>`).join('')}</ul>`
      : `<p style="color:var(--muted);font-size:0.9rem;margin:0.5rem 0;">No ha aportado libros aún</p>`;

    return `
      <div class="card">
        <h3>${s.id}. ${s.nombre} ${s.apellidos}</h3>
        ${loanHtml}
        ${pointsHtml}
        <div style="font-size:0.9rem;color:var(--muted);margin-top:0.5rem;"><strong>Libros aportados (${s.aportados.length}):</strong></div>
        ${booksHtml}
        <div class="actions">
          ${hasLoan
            ? `<button class="btn btn-warning" onclick="openReturn(${s.id})">Devolver</button>
               <button class="btn btn-outline" onclick="openLoan(${s.id})">Cambiar libro</button>`
            : `<button class="btn btn-primary" onclick="openLoan(${s.id})">Prestar libro</button>`}
          <button class="btn btn-success" onclick="openAddBook(${s.id})">+ Aportar libro</button>
          ${hasFicha
            ? `<button class="btn btn-outline" onclick="removeFicha(${s.id})">Quitar ficha</button>`
            : `<button class="btn btn-primary" onclick="openAddFicha(${s.id})">+ Añadir ficha</button>`}
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('view-alumnos').innerHTML = `<div class="grid">${html || '<p>No hay alumnos. Usa “Vaciar todos los datos” y luego importa o añade manualmente.</p>'}</div>`;
}

function renderCatalogo() {
  const term = normalize(searchTerm);
  const bookMap = {};
  data.students.forEach(s => {
    s.aportados.forEach(book => {
      if (!bookMap[book]) bookMap[book] = [];
      bookMap[book].push(s.nombre + ' ' + s.apellidos);
    });
  });

  let books = Object.keys(bookMap).sort((a,b) => a.localeCompare(b, 'es'));
  if (term) {
    books = books.filter(b => normalize(b).includes(term) || bookMap[b].some(owner => normalize(owner).includes(term)));
  }

  const html = books.map(book => {
    const owners = bookMap[book];
    return `<div class="catalog-item">
      <div><strong>${book}</strong><br><small style="color:var(--muted);">Aportado por: ${owners.join(', ')}</small></div>
      <span class="badge badge-yes">${owners.length}</span>
    </div>`;
  }).join('');

  document.getElementById('view-catalogo').innerHTML = `
    <h2 style="margin-top:0;">Catálogo de libros de la biblioteca</h2>
    <p style="color:var(--muted);">${books.length} títulos ${term ? 'que coinciden' : 'únicos aportados por los alumnos'}</p>
    ${html || '<p>No hay libros que coincidan con la búsqueda.</p>'}
  `;
}

function renderFichas() {
  const current = data.currentTrimestre || "1";
  let summaryHtml = `<div class="summary-box ${current ? 'current-trim' : ''}"><h3 style="margin-top:0;">Nota de fichas del trimestre actual (${current}º)</h3>
  <p style="margin:0.3rem 0 0.8rem; color:var(--muted);">Cada ficha entregada vale <strong>0,25 puntos</strong></p>
  <table class="ficha-table"><thead><tr><th>#</th><th>Alumno</th><th>Ficha entregada</th><th>Puntos</th></tr></thead><tbody>`;
  data.students.forEach(s => {
    const has = data.fichas[current] && data.fichas[current][String(s.id)];
    const pts = has ? 0.25 : 0;
    summaryHtml += `<tr><td>${s.id}</td><td>${s.nombre} ${s.apellidos}</td><td>${has ? '<span class="badge badge-yes">Sí</span>' : '<span class="badge badge-no">No</span>'}</td><td><strong>${pts.toFixed(2)}</strong></td></tr>`;
  });
  summaryHtml += '</tbody></table></div>';

  let html = summaryHtml;
  for (const trim of ['1','2','3']) {
    const fichas = data.fichas[trim] || {};
    const delivered = Object.keys(fichas).length;
    const isCurrent = trim === current;
    html += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
      <h3 style="margin:0;">Fichas de lectura · ${trim}er Trimestre ${isCurrent ? '<span class="badge badge-yes">ACTUAL</span>' : ''} <small style="color:var(--muted);">(${delivered} entregadas)</small></h3>
      <button class="btn btn-danger btn-sm" onclick="resetTrimestre('${trim}')">🔄 Reset trimestre</button>
    </div>
    <table class="ficha-table">
      <thead><tr><th>#</th><th>Alumno</th><th>Libro de la ficha</th><th>Estado</th><th></th></tr></thead>
      <tbody>`;
    data.students.forEach(s => {
      const book = fichas[String(s.id)];
      html += `<tr>
        <td>${s.id}</td>
        <td>${s.nombre} ${s.apellidos}</td>
        <td>${book || '—'}</td>
        <td>${book ? '<span class="badge badge-yes">Entregada</span>' : '<span class="badge badge-no">Pendiente</span>'}</td>
        <td>${book ? `<button class="btn btn-outline btn-sm" onclick="clearFicha('${trim}', ${s.id})">Quitar</button>` : ''}</td>
      </tr>`;
    });
    html += '</tbody></table>';
  }
  document.getElementById('view-fichas').innerHTML = html;
}

function renderAll() {
  const sel = document.getElementById('trimSelect');
  if (sel) sel.value = data.currentTrimestre || "1";
  renderStats();
  renderAlumnos();
  renderCatalogo();
  renderFichas();
}

// ========== INTERACCIONES ==========
function openLoan(id) {
  currentStudentId = id;
  const s = getStudent(id);
  document.getElementById('modalTitle').textContent = s.prestamo_libro ? 'Cambiar libro prestado' : 'Prestar libro';
  document.getElementById('modalStudentName').textContent = s.nombre + ' ' + s.apellidos;
  document.getElementById('modalBook').value = s.prestamo_libro || '';
  document.getElementById('modalDate').value = s.prestamo_fecha || new Date().toISOString().slice(0,10);
  document.getElementById('modalLoan').classList.add('show');
  document.getElementById('modalBook').focus();
}

function openReturn(id) {
  if (confirm('¿Devolver el libro y marcar como disponible?')) {
    const s = getStudent(id);
    s.prestamo_libro = null;
    s.prestamo_fecha = null;
    saveData();
    renderAll();
  }
}

function saveLoan() {
  const s = getStudent(currentStudentId);
  const book = document.getElementById('modalBook').value.trim();
  const date = document.getElementById('modalDate').value.trim();
  if (!book) { alert('Escribe el título del libro'); return; }
  s.prestamo_libro = book;
  s.prestamo_fecha = date || null;
  saveData();
  closeModal();
  renderAll();
}

function openAddBook(id) {
  currentStudentId = id;
  const s = getStudent(id);
  document.getElementById('modalAddStudent').textContent = s.nombre + ' ' + s.apellidos;
  document.getElementById('modalAddTitle').value = '';
  document.getElementById('modalAddBook').classList.add('show');
  document.getElementById('modalAddTitle').focus();
}

function addContributedBook() {
  const title = document.getElementById('modalAddTitle').value.trim();
  if (!title) { alert('Escribe el título'); return; }
  const s = getStudent(currentStudentId);
  if (!s.aportados.includes(title)) {
    s.aportados.push(title);
  }
  saveData();
  closeModal();
  renderAll();
}

function openAddFicha(id) {
  currentStudentId = id;
  const s = getStudent(id);
  const trim = data.currentTrimestre || "1";
  document.getElementById('modalFichaStudent').textContent = s.nombre + ' ' + s.apellidos;
  document.getElementById('modalFichaTrim').textContent = trim + 'er Trimestre';
  document.getElementById('modalFichaTitle').value = '';
  document.getElementById('modalAddFicha').classList.add('show');
  document.getElementById('modalFichaTitle').focus();
}

function saveFicha() {
  const title = document.getElementById('modalFichaTitle').value.trim();
  if (!title) { alert('Escribe el título del libro de la ficha'); return; }
  const trim = data.currentTrimestre || "1";
  if (!data.fichas[trim]) data.fichas[trim] = {};
  data.fichas[trim][String(currentStudentId)] = title;
  saveData();
  closeModal();
  renderAll();
}

function removeFicha(id) {
  const trim = data.currentTrimestre || "1";
  if (!data.fichas[trim] || !data.fichas[trim][String(id)]) return;
  if (confirm('¿Quitar la ficha de este alumno en el trimestre actual? Se restarán 0,25 puntos.')) {
    delete data.fichas[trim][String(id)];
    saveData();
    renderAll();
  }
}

function removeBook(studentId, index) {
  const s = getStudent(studentId);
  if (confirm(`¿Quitar el libro "${s.aportados[index]}" de la biblioteca de este alumno?`)) {
    s.aportados.splice(index, 1);
    saveData();
    renderAll();
  }
}

function clearFicha(trim, studentId) {
  if (!data.fichas[trim]) return;
  if (confirm('¿Quitar esta ficha?')) {
    delete data.fichas[trim][String(studentId)];
    saveData();
    renderAll();
  }
}

function resetTrimestre(trim) {
  if (confirm(`¿Resetear todas las fichas del ${trim}er trimestre? Esta acción no se puede deshacer.`)) {
    data.fichas[trim] = {};
    saveData();
    renderAll();
  }
}

function closeModal() {
  document.querySelectorAll('.modal').forEach(m => m.classList.remove('show'));
}

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeTab = tab.dataset.tab;
    document.getElementById('view-alumnos').style.display = activeTab === 'alumnos' ? 'block' : 'none';
    document.getElementById('view-catalogo').style.display = activeTab === 'catalogo' ? 'block' : 'none';
    document.getElementById('view-fichas').style.display = activeTab === 'fichas' ? 'block' : 'none';
  });
});

// Search
document.getElementById('search').addEventListener('input', (e) => {
  searchTerm = e.target.value.trim();
  if (activeTab === 'alumnos') renderAlumnos();
  else if (activeTab === 'catalogo') renderCatalogo();
  else renderFichas();
});

// Export / Import / Reset
function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'biblioteca_6a_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}

function exportCSV() {
  // CSV principal: alumnos con préstamos, puntos y fichas
  let csv = '\uFEFF'; // BOM for Excel/Google Sheets
  csv += 'ID,Nombre,Apellidos,Préstamo Libro,Préstamo Fecha,Puntos Ficha Trimestre Actual,Ficha 1er Trim,Ficha 2º Trim,Ficha 3er Trim,Libros Aportados\n';

  data.students.forEach(s => {
    const trim = data.currentTrimestre || '1';
    const pts = getCurrentPoints(s.id).toFixed(2);
    const f1 = (data.fichas['1'] && data.fichas['1'][String(s.id)]) || '';
    const f2 = (data.fichas['2'] && data.fichas['2'][String(s.id)]) || '';
    const f3 = (data.fichas['3'] && data.fichas['3'][String(s.id)]) || '';
    const aportados = (s.aportados || []).join(' | ');

    const row = [
      s.id,
      '"' + (s.nombre || '').replace(/"/g, '""') + '"',
      '"' + (s.apellidos || '').replace(/"/g, '""') + '"',
      '"' + (s.prestamo_libro || '').replace(/"/g, '""') + '"',
      '"' + (s.prestamo_fecha || '').replace(/"/g, '""') + '"',
      pts,
      '"' + f1.replace(/"/g, '""') + '"',
      '"' + f2.replace(/"/g, '""') + '"',
      '"' + f3.replace(/"/g, '""') + '"',
      '"' + aportados.replace(/"/g, '""') + '"'
    ].join(',');
    csv += row + '\n';
  });

  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'biblioteca_6a_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

function importData(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);
      if (imported.students && Array.isArray(imported.students)) {
        data = imported;
        if (!data.fichas) data.fichas = {"1":{},"2":{},"3":{}};
        if (!data.currentTrimestre) data.currentTrimestre = "1";
        saveData();
        renderAll();
        alert('Datos importados correctamente');
      } else {
        alert('Formato de archivo no válido');
      }
    } catch(e) { alert('Error al leer el archivo'); }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

function resetEmpty() {
  if (confirm('¿VACIAR TODOS LOS DATOS?\n\nSe eliminarán todos los alumnos, préstamos, fichas y libros.\nEsta acción no se puede deshacer.\n\nIdeal para que otros cursos empiecen de cero.')) {
    data = {
      students: [],
      fichas: {"1": {}, "2": {}, "3": {}},
      currentTrimestre: "1"
    };
    saveData();
    renderAll();
    alert('Aplicación vaciada. Ahora puedes importar datos o añadir alumnos manualmente.');
  }
}

// Close modal on background click
document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', (e) => { if (e.target === m) closeModal(); });
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(err => console.log("SW error:", err));
  });
}

loadData();
renderAll();
